<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ortak Masraf Paylaştırıcı</title>
  <style>
    :root {
      color-scheme: light;
      --color-bg: #F7F8FC;
      --color-surface: #FFFFFF;
      --color-surface-secondary: #F0F1F7;
      --color-surface-hover: #E9EAF3;
      --color-border: #DFE2EC;
      --color-border-strong: #C8CBD7;
      --color-text-primary: #25283A;
      --color-text-secondary: #4F5366;
      --color-text-muted: #75798C;
      --color-text-disabled: #A3A6B3;
      --color-text-on-primary: #FFFFFF;
      --color-primary: #8E8AC7;
      --color-primary-light: #E6E4F5;
      --color-primary-hover: #7D78B7;
      --color-primary-dark: #6F6AAA;
      --color-secondary: #76A9D1;
      --color-secondary-light: #E1EFF8;
      --color-secondary-dark: #5689B2;
      --color-success: #4C9B76;
      --color-success-light: #E2F3E9;
      --color-error: #C75C68;
      --color-error-light: #F9E3E6;
      --color-warning: #C5943F;
      --color-warning-light: #FFF2D9;
      --color-info: #528FC4;
      --color-info-light: #E2F0FA;
      --shadow: 0 14px 38px rgba(27, 39, 51, 0.08);
      --radius: 8px;
    }

    .theme-purple { --color-primary: #8E8AC7; --color-primary-light: #E6E4F5; --color-primary-hover: #7D78B7; --color-primary-dark: #6F6AAA; }
    .theme-blue { --color-primary: #76A9D1; --color-primary-light: #E1EFF8; --color-primary-hover: #6699C2; --color-primary-dark: #5689B2; }
    .theme-mint { --color-primary: #72B99A; --color-primary-light: #DFF3EA; --color-primary-hover: #62A98A; --color-primary-dark: #52977A; }
    .theme-pink { --color-primary: #D28FAF; --color-primary-light: #F6E1EB; --color-primary-hover: #C27E9F; --color-primary-dark: #B56E90; }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background:
        linear-gradient(180deg, var(--color-primary-light), transparent 360px),
        var(--color-bg);
      color: var(--color-text-primary);
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      border: 0;
      border-radius: 7px;
      cursor: pointer;
      transition: transform 0.15s ease, background 0.15s ease, border-color 0.15s ease;
    }

    button:active {
      transform: translateY(1px);
    }

    .app {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      padding: 28px 0 40px;
    }

    .topbar {
      display: grid;
      grid-template-columns: 1.2fr 0.8fr;
      gap: 22px;
      align-items: end;
      margin-bottom: 24px;
    }

    .title h1 {
      margin: 0 0 8px;
      font-size: clamp(28px, 4vw, 44px);
      line-height: 1.02;
      letter-spacing: 0;
    }

    .title p {
      margin: 0;
      color: var(--color-text-muted);
      max-width: 760px;
      line-height: 1.55;
    }

    .summary-strip {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    .metric {
      background: rgba(255, 255, 255, 0.84);
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      padding: 14px;
      box-shadow: var(--shadow);
      min-width: 0;
    }

    .metric span {
      display: block;
      color: var(--color-text-muted);
      font-size: 13px;
      margin-bottom: 6px;
    }

    .metric strong {
      display: block;
      font-size: 20px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .workspace {
      display: grid;
      grid-template-columns: minmax(310px, 390px) minmax(0, 1fr);
      gap: 18px;
      align-items: start;
    }

    section {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 16px;
      border-bottom: 1px solid var(--color-border);
    }

    .panel-header h2 {
      margin: 0;
      font-size: 18px;
    }

    .panel-header p {
      margin: 4px 0 0;
      color: var(--color-text-muted);
      font-size: 13px;
      line-height: 1.35;
    }

    .panel-body {
      padding: 16px;
    }

    .controls-row {
      display: grid;
      gap: 7px;
      margin-bottom: 14px;
    }

    label {
      display: grid;
      gap: 7px;
      color: var(--color-text-secondary);
      font-size: 13px;
      font-weight: 700;
    }

    input,
    select {
      width: 100%;
      border: 1px solid var(--color-border);
      border-radius: 7px;
      padding: 11px 12px;
      background: #fff;
      color: var(--color-text-primary);
      outline: none;
      min-height: 42px;
    }

    input:focus,
    select:focus {
      border-color: var(--color-primary);
      box-shadow: 0 0 0 3px var(--color-primary-light);
    }

    .primary,
    .secondary,
    .danger {
      min-height: 42px;
      padding: 0 14px;
      font-weight: 700;
      white-space: nowrap;
    }

    .primary {
      background: var(--color-primary);
      color: var(--color-text-on-primary);
    }

    .primary:hover {
      background: var(--color-primary-hover);
    }

    .secondary {
      background: var(--color-surface-secondary);
      color: var(--color-text-primary);
      border: 1px solid var(--color-border);
    }

    .secondary:hover {
      background: var(--color-surface-hover);
    }

    .danger {
      width: 42px;
      padding: 0;
      background: var(--color-error-light);
      color: var(--color-error);
      border: 1px solid var(--color-error-light);
      font-size: 20px;
      line-height: 1;
    }

    .people-list,
    .expenses-list,
    .results-list {
      display: grid;
      gap: 10px;
    }

    .person-row,
    .expense-row {
      display: grid;
      gap: 10px;
      align-items: end;
    }

    .person-row {
      grid-template-columns: minmax(0, 1fr);
      gap: 7px;
    }

    .participant-input-control > button { flex: 0 0 auto; width: auto; min-height: 34px; margin: 3px; }
    .participant-input-control > .danger { width: 34px; }

    .expense-row {
      grid-template-columns: minmax(0, 1.1fr) minmax(0, .9fr) minmax(0, 1.2fr);
      padding: 10px;
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      background: #fbfcfe;
    }

    .expense-summary { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; align-items: center; gap: 4px 12px; width: 100%; padding: 10px 12px; border: 1px solid var(--color-border); border-radius: var(--radius); background: var(--color-surface-secondary); color: var(--color-text-primary); text-align: left; }
    .expense-summary:hover { background: var(--color-surface-hover); }
    .expenses-list { grid-template-columns: repeat(auto-fit, minmax(min(100%, max(270px, calc((100% - 10px) / 2))), 1fr)); }
    .expense-card { grid-column: 1 / -1; min-width: 0; }
    .expense-card.is-collapsed { grid-column: auto; }
    .expenses-list > .empty { grid-column: 1 / -1; }
    .expense-summary-title, .expense-summary-meta { min-width: 0; overflow-wrap: anywhere; }
    .expense-summary-meta { grid-column: 1 / 3; color: var(--color-text-secondary); font-size: 12px; }
    .expense-summary-price { font-size: 14px; font-weight: 700; }
    .expense-summary-arrow { grid-column: 3; grid-row: 1 / 3; color: var(--color-text-secondary); }

    .result-item,
    .balance-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      background: #fbfcfe;
      padding: 12px 14px;
      line-height: 1.35;
    }

    .result-item strong,
    .balance-item strong {
      color: var(--color-text-primary);
    }

    .amount {
      color: var(--color-primary-dark);
      font-weight: 800;
      white-space: nowrap;
    }

    .positive {
      color: var(--color-success);
    }

    .negative {
      color: var(--color-error);
    }

    .neutral {
      color: var(--color-text-muted);
    }

    .empty {
      border: 1px dashed var(--color-border-strong);
      border-radius: var(--radius);
      color: var(--color-text-muted);
      padding: 16px;
      text-align: center;
      background: #fbfcfe;
      line-height: 1.45;
    }

    .stack {
      display: grid;
      gap: 18px;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 14px;
    }

    .warning {
      margin-top: 12px;
      color: var(--color-warning);
      font-size: 13px;
      line-height: 1.4;
    }

    .copy-status {
      min-height: 18px;
      margin: 10px 0 0;
      color: var(--color-success);
      font-size: 13px;
      line-height: 1.4;
    }

    button:disabled { opacity: .5; cursor: not-allowed; }
    [hidden] { display: none !important; }
    .panel-header { flex-wrap: wrap; }
    .expense-row > label { min-width: 0; }
    .expense-participants { grid-column: 1 / -1; min-width: 0; margin: 0; padding: 10px; border: 1px solid var(--color-border); border-radius: 7px; }
    .expense-participants legend { font-size: 13px; font-weight: 700; color: var(--color-text-secondary); }
    .participant-options { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 8px; margin-top: 8px; }
    .check-label { position: relative; display: flex; align-items: center; justify-content: center; gap: 9px; min-height: 44px; padding: 8px 11px; border: 1px solid var(--color-border); border-radius: 8px; background: var(--color-surface); overflow-wrap: anywhere; cursor: pointer; user-select: none; }
    .check-label:has(input:checked) { border-color: var(--color-primary); background: var(--color-primary-light); color: var(--color-primary-dark); }
    .check-label > input[type="checkbox"] { position: absolute; width: 1px; height: 1px; min-height: 0; opacity: 0; pointer-events: none; }
    .split-controls { display: grid; gap: 10px; margin-bottom: 12px; }
    .sharing-toggles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
    .mode-option { position: relative; display: flex; align-items: center; justify-content: center; gap: 9px; min-height: 44px; padding: 8px 11px; border: 1px solid var(--color-border); border-radius: 8px; background: var(--color-surface); color: var(--color-text-secondary); font-size: 13px; font-weight: 700; cursor: pointer; user-select: none; }
    .mode-option input { position: absolute; width: 1px; height: 1px; min-height: 0; opacity: 0; pointer-events: none; }
    .mode-option:has(input:checked) { border-color: var(--color-primary); background: var(--color-primary-light); color: var(--color-primary-dark); }
    .participant-card { min-width: 0; border: 1px solid var(--color-border); border-radius: 8px; background: var(--color-surface); overflow: hidden; }
    .participant-card:has(.participant-choice input:checked) { border-color: var(--color-primary); background: var(--color-primary-light); }
    .participant-choice { border: 0; border-radius: 0; background: transparent; min-height: 44px; }
    .participant-card:has(.participant-choice input:checked) .participant-choice { color: var(--color-primary-dark); }
    .participant-control { display: flex; align-items: center; justify-content: center; gap: 6px; padding: 0 8px 8px; }
    .step-button { width: 36px; min-width: 36px; min-height: 36px; padding: 0; border: 1px solid var(--color-border-strong); background: var(--color-surface); color: var(--color-primary-dark); font-size: 20px; font-weight: 700; }
    .step-value { min-width: 34px; text-align: center; font-weight: 800; }
    .personal-amount { min-height: 38px; padding: 8px 10px; text-align: center; background: var(--color-surface); }
    .unit-mode { display: flex; align-items: stretch; min-width: 0; border: 1px solid var(--color-border); border-radius: 8px; background: var(--color-surface); }
    .unit-mode:has(input:checked) { border-color: var(--color-primary); background: var(--color-primary-light); }
    .unit-mode .mode-option { flex: 1; min-width: 0; padding: 6px 4px; border: 0; background: transparent; }
    .unit-button { align-self: center; flex: 0 1 auto; min-width: 0; min-height: 36px; margin: 3px; padding: 3px 6px; background: var(--color-surface-secondary); color: var(--color-text-secondary); font-size: 11px; font-weight: 700; overflow-wrap: anywhere; }
    .expense-amount-field { display: grid; gap: 7px; min-width: 0; }
    .expense-amount-heading { display: flex; flex-wrap: wrap; justify-content: flex-start; align-items: baseline; gap: 3px 8px; }
    .amount-check { font-size: 11px; font-weight: 700; overflow-wrap: anywhere; }
    .expense-amount-line { display: grid; grid-template-columns: minmax(0, 1fr) 42px; gap: 8px; align-items: center; }
    .expense-amount-control { position: relative; display: flex; align-items: center; min-height: 42px; border: 1px solid var(--color-border); border-radius: 7px; background: var(--color-surface); }
    .expense-amount-control:has(input:focus) { border-color: var(--color-primary); box-shadow: 0 0 0 3px var(--color-primary-light); }
    .expense-amount-control:has(input[aria-invalid="true"]) { border-color: var(--color-error); }
    .expense-amount-control input { flex: 1 1 0; width: auto; min-width: 0; min-height: 40px; padding-right: 3px; border: 0; background: transparent; box-shadow: none; }
    .expense-amount-control .unit-button { flex: 0 1 auto; max-width: 52%; }
    .expense-amount-control .unit-button.has-total { display: grid; align-content: center; gap: 1px; line-height: 1.1; max-width: 64%; }
    .unit-button-total { color: var(--color-text-primary); font-size: 12px; }
    .unit-mode .mode-option:has(input:focus-visible) { outline: 2px solid var(--color-primary-dark); }
    .unit-control { flex-wrap: wrap; }
    .unit-control input { flex: 1 1 52px; min-width: 0; }
    .person-value-control { width: 100%; }
    .unit-preview { color: var(--color-text-secondary); font-size: 12px; font-weight: 700; overflow-wrap: anywhere; }
    .unit-dialog { width: min(340px, calc(100% - 24px)); max-height: calc(100% - 24px); padding: 18px; border: 1px solid var(--color-border); border-radius: 12px; color: var(--color-text-primary); background: var(--color-surface); box-shadow: var(--shadow); }
    .unit-dialog::backdrop { background: rgb(37 40 58 / .36); }
    .unit-dialog form { display: grid; gap: 12px; }
    .unit-dialog h2, .unit-dialog .warning { margin: 0; }
    .unit-dialog .actions { display: flex; flex-wrap: nowrap; gap: 6px; margin: 0; }
    .unit-dialog .actions button { flex: 1 1 auto; min-width: 0; padding: 0 6px; font-size: 13px; }
    .unit-total-control { position: relative; display: block; }
    .unit-total-control:has(.unit-preview:not([hidden])) input { padding-right: 50%; text-align: left; }
    .unit-total-control .unit-preview { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); max-width: calc(50% - 12px); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; pointer-events: none; }
    .field-hint { color: var(--color-text-muted); font-size: 12px; line-height: 1.5; }
    .storage-status { font-size: 13px; line-height: 1.5; color: var(--color-text-secondary); }
    [aria-invalid="true"] { border-color: var(--color-error); }

    @media (max-width: 900px) {
      .topbar,
      .workspace {
        grid-template-columns: 1fr;
      }

      .summary-strip {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
    }

    @media (max-width: 680px) {
      .sharing-toggles { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) minmax(0, 1.6fr); gap: 6px; }

      .app {
        width: min(100% - 20px, 1180px);
        padding-top: 18px;
      }

      .expense-row,
      .split-controls {
        grid-template-columns: 1fr;
      }

      .summary-strip { gap: 6px; }
      .metric { padding: 10px 8px; }
      .metric span { min-height: 28px; margin-bottom: 4px; font-size: 11px; line-height: 1.25; }
      .metric strong { font-size: 16px; }

      .participant-options { grid-template-columns: repeat(2, minmax(0, 1fr)); }

      .danger {
        width: 100%;
      }

      .result-item,
      .balance-item {
        align-items: flex-start;
        flex-direction: column;
      }
    }
  </style>
</head>
<body class="theme-mint">
  <main class="app">
    <div class="topbar">
      <div class="title">
        <h1>Ortak Masraf Paylaştırıcı</h1>
      </div>

      <div class="summary-strip" aria-live="polite">
        <div class="metric">
          <span>Toplam masraf</span>
          <strong id="totalAmount">0,00 TL</strong>
        </div>
        <div class="metric">
          <span>Kişi başı ortalama</span>
          <strong id="perPersonAmount">0,00 TL</strong>
        </div>
        <div class="metric">
          <span>Katılımcı</span>
          <strong id="peopleCountMetric">0 kişi</strong>
        </div>
      </div>
    </div>

    <div class="workspace">
      <section>
        <div class="panel-header">
          <div>
            <h2>Katılımcılar</h2>
          </div>
        </div>
        <div class="panel-body">
          <div class="controls-row">
            <label for="personCountInput">Kişi sayısı</label>
            <div class="expense-amount-control participant-input-control">
              <input id="personCountInput" type="number" min="1" max="50" step="1" value="4">
              <button class="secondary" id="applyCountButton" type="button">Uygula</button>
            </div>
          </div>
          <p id="peopleWarning" class="warning" role="status" hidden></p>
          <div class="people-list" id="peopleList"></div>
        </div>
      </section>

      <div class="stack">
        <section>
          <div class="panel-header">
            <div>
              <h2>Harcamalar</h2>
            </div>
            <button class="primary" id="addExpenseButton" type="button">+ Harcama</button>
          </div>
          <div class="panel-body">
            <div class="expenses-list" id="expensesList"></div>
            <p class="warning" id="formWarning" role="status" hidden></p>
          </div>
        </section>

        <section>
          <div class="panel-header">
            <div>
              <h2>Sonuç</h2>
            </div>
            <div class="actions" style="margin-top: 0;">
              <button class="primary" id="copyResultButton" type="button">Sonucu kopyala</button>
              <button class="secondary" id="undoButton" type="button" disabled>Geri al</button>
              <button class="secondary" id="clearButton" type="button">Harcamaları temizle</button>
            </div>
          </div>
          <div class="panel-body">
            <div class="results-list" id="settlementsList"></div>
            <div class="results-list" id="balancesList" style="margin-top: 14px;"></div>
            <p id="storageStatus" class="storage-status" role="status">Değişiklikler bu tarayıcıya otomatik kaydedilir.</p>
            <p class="copy-status" id="copyStatus" aria-live="polite"></p>
          </div>
        </section>
      </div>
    </div>
  </main>

  <dialog class="unit-dialog" id="unitDialog" aria-labelledby="unitDialogTitle">
    <form id="unitForm">
      <h2 id="unitDialogTitle">Birim</h2>
      <label>Birim
        <select id="unitType"></select>
      </label>
      <label><span id="unitPriceLabel">Birim fiyatı (TL)</span>
        <input id="unitPrice" inputmode="decimal" placeholder="Örn. 450" required>
      </label>
      <label id="unitTotalField" hidden>Toplam fiyat (TL)
        <span class="unit-total-control">
          <input id="unitTotal" inputmode="decimal" placeholder="İsteğe bağlı" aria-describedby="unitQuantityPreview">
          <span class="unit-preview" id="unitQuantityPreview" hidd
